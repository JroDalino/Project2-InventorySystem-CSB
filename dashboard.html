<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inventory Dashboard</title>
<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background-image: url('wow.jpg');
        display: flex;
    }

/* Sidebar Title */
.sidebar h1 {
    color: rgb(230, 172, 178);
    background-color: rgb(185, 67, 102);
    transition: background 0.3s, opacity 0.3s;
    border-radius: 8px;
    padding: 8px;
    text-align: center;
}

/* Sidebar */
.sidebar {
    width: 220px;
    background-image: url('hp.jpg');
    background-size: cover;
    background-position: center;
    color: white;
    height: 100vh;
    padding: 20px;
    box-shadow: #f109a8 0px 4px 12px;
    position: sticky;
    top: 0;
}

.sidebar h2 {
    margin-bottom: 30px;
}

.sidebar a {
    display: block;
    color: rgb(175, 0, 53);
    text-decoration: none;
    margin: 15px 0;
    opacity: 0.9;
    font-weight: bold;
    padding: 8px;
    border-radius: 8px;
    transition: background 0.3s, opacity 0.3s;
    box-shadow: #f109a8 0px 4px 12px;
    background-color: rgb(236, 119, 164);
}

.sidebar a:hover {
    opacity: 1;
    background: rgba(0,0,0,0.3);
}

    /* Main Content */
    .main {
        flex: 1;
        padding: 20px 40px;
    }

     .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 40px;
        background: rgb(255, 219, 254);
        border-bottom: 1px solid #c37979;
        border-radius: 20px;
        margin-bottom: 1rem;
    }

    .title {
        line-height: 1.2;
    }

    .title small {
        display: block;
        color: #761b65;
        font-size: 14px;
    }

    .title h1 {
        margin: 0;
        font-size: 26px;
        color: #e59de6;
        font-weight: bold;
    }

    .cards {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
    }

    .card {
        flex: 1;
        min-width: 180px;
        padding: 20px;
        border-radius: 12px;
        color: white;
        font-weight: bold;
    }

    .blue { background: #d51367; }
    .green { background: #e03c8b; }
    .orange { background: #e187a5; }
    .purple { background: #e03c8b; }
    .red { background: #d51367; }

    .table-section {
        margin-top: 30px;
        background: white;
        padding: 20px;
        border-radius: 12px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th, td {
        padding: 10px;
        text-align: left;
    }

    th {
        background: #eee;
    }
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
     <div class="logo">
        <img src="bigeyes.webp" alt="Logo" style="width: 90px; border-radius: 8px; margin-bottom: 20px;">
    </div>
    <h1>Inventory</h1>
    
    <a href="dashboard.html">Dashboard</a>
    <a href="product.html">Product</a>
    <a href="order.html">Order</a>
    <a href="supplier.html">Supplier</a>
    <a href="profile.html">Profile</a>
</div>

<!-- Main Content -->
<div class="main">

    <!-- Header -->
   <div class="header">
    <div class="title">
        <small>Primary</small>
        <h1>Dashboard</h1>
    </div>
</div>

    <!-- Cards -->
    <div class="cards">
        <div class="card blue">
            <h3>Total Products</h3>
            <p>120</p>
        </div>

        <div class="card green">
            <h3>Total Stock</h3>
            <p>540</p>
        </div>

        <div class="card orange">
            <h3>Pending Orders</h3>
            <p>15</p>
        </div>

        <div class="card purple">
            <h3>Total Sales</h3>
            <p>320</p>
        </div>

        <div class="card red">
            <h3>Out of Stock</h3>
            <p>8</p>
        </div>
    </div>

    <!-- Table -->
    <div class="table-section">
        <h3>Recent Products</h3>
        <table>
            <tr>
                <th>Product</th>
                <th>Stock</th>
                <th>Status</th>
            </tr>
            <tr>
                <td>Notebook</td>
                <td>50</td>
                <td>In Stock</td>
            </tr>
            <tr>
                <td>Ballpen</td>
                <td>5</td>
                <td>Low Stock</td>
            </tr>
        </table>
    </div>

</div>

</body>
</html>
